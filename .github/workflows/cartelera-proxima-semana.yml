name: Actualizar cartelera - Semana siguiente

on:
  # GitHub Actions usa UTC. Se programan las horas posibles de invierno y verano;
  # el primer paso comprueba la hora local Europe/Madrid antes de ejecutar el scraper.
  schedule:
    # Lunes: 10:00 y 20:00 (hora peninsular)
    - cron: "0 8,9,18,19 * * 1"
    # Martes a viernes: 20:00
    - cron: "0 18,19 * * 2-5"
    # Sábados y domingos: 10:00, 12:00, 14:00, 17:00, 19:00 y 21:00
    - cron: "0 8,9,10,11,12,13,15,16,17,18,19,20 * * 0,6"
  workflow_dispatch:

jobs:
  update-next-week:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Comprobar horario de Navarra (Europe/Madrid)
        id: horario
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Las ejecuciones manuales desde GitHub siempre continúan.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Ejecución manual: se continúa."
            exit 0
          fi

          DIA_HORA="$(TZ=Europe/Madrid date +'%u-%H')"
          case "$DIA_HORA" in
            1-10|1-20|\
            2-20|3-20|4-20|5-20|\
            6-10|6-12|6-14|6-17|6-19|6-21|\
            7-10|7-12|7-14|7-17|7-19|7-21)
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "Horario programado correcto: $DIA_HORA"
              ;;
            *)
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Ejecución omitida: $DIA_HORA no está en el horario local configurado."
              ;;
          esac

      - name: Checkout
        if: steps.horario.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.horario.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar jsdom
        if: steps.horario.outputs.run == 'true'
        run: npm install jsdom --no-save

      - name: Ejecutar scraper
        if: steps.horario.outputs.run == 'true'
        run: node scripts/scrape-cartelera-proxima-semana.mjs

      - name: 📤 Subir HTML de depuración
        if: steps.horario.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-completo
          path: data/debug-completo.html

      - name: Commit y push
        if: steps.horario.outputs.run == 'true'
        run: |
          git config user.name "larraun-bot"
          git config user.email "bot@larraunpilota.eus"
          git add data/cartelera-proxima-semana.json
          git commit -m "🔄 Actualiza cartelera semana siguiente ($(date +'%Y-%m-%d'))" || echo "Sin cambios"
          git push
