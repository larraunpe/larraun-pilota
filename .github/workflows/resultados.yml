name: Actualizar resultados Larraun

on:
  # GitHub Actions usa UTC. Se programan las horas posibles de invierno y verano;
  # el primer paso comprueba la hora local Europe/Madrid antes de ejecutar el scraper.
  schedule:
    # Lunes: 10:00, 14:00, 17:00 y 21:00 (hora peninsular)
    - cron: "0 8,9,12,13,15,16,19,20 * * 1"
    # Martes a jueves: 10:00 y 21:00
    - cron: "0 8,9,19,20 * * 2-4"
    # Viernes: 10:00, 20:00, 21:00 y 22:00
    - cron: "0 8,9,18,19,20,21 * * 5"
    # Sábados y domingos: 10:00, 12:00, 14:00, 17:00, 19:00, 21:00 y 23:00
    - cron: "0 8,9,10,11,12,13,15,16,17,18,19,20,21,22 * * 0,6"
  workflow_dispatch:

jobs:
  update-resultados:
    runs-on: ubuntu-latest

    steps:
      - name: Comprobar horario de Navarra (Europe/Madrid)
        id: horario
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Las ejecuciones manuales desde GitHub siempre continúan.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Ejecución manual: se continúa."
            exit 0
          fi

          DIA_HORA="$(TZ=Europe/Madrid date +'%u-%H')"
          case "$DIA_HORA" in
            1-10|1-14|1-17|1-21|\
            2-10|2-21|3-10|3-21|4-10|4-21|\
            5-10|5-20|5-21|5-22|\
            6-10|6-12|6-14|6-17|6-19|6-21|6-23|\
            7-10|7-12|7-14|7-17|7-19|7-21|7-23)
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "Horario programado correcto: $DIA_HORA"
              ;;
            *)
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Ejecución omitida: $DIA_HORA no está en el horario local configurado."
              ;;
          esac

      - name: Checkout repositorio
        if: steps.horario.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        if: steps.horario.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        if: steps.horario.outputs.run == 'true'
        run: npm install axios cheerio iconv-lite

      - name: Ejecutar scraper de resultados
        if: steps.horario.outputs.run == 'true'
        run: |
          node scripts/scrape-resultados.js
          echo "📄 Resultados generados:"
          cat data/resultados-larraun.json || echo "❌ Archivo no generado"

      - name: Commit y Push seguros
        if: steps.horario.outputs.run == 'true'
        run: |
          git config user.name "larraun-bot"
          git config user.email "bot@larraunpilota.eus"

          git add data/resultados-larraun.json

          if git diff --cached --quiet; then
            echo "ℹ️ Sin cambios en resultados"
          else
            git commit -m "🏁 Actualiza resultados Larraun"
            git pull origin main --rebase --autostash
            git push origin main
          fi
