name: Actualizar cartelera Larraun

on:
  # GitHub Actions programa en UTC. Se incluyen las horas UTC de invierno
  # y verano; el filtro posterior valida la hora local Europe/Madrid.
  schedule:
    # Lunes: 10:00, 12:00, 14:00, 17:00, 19:00, 21:00 y 23:00
    - cron: "0 8,9,10,11,12,13,15,16,17,18,19,20,21,22 * * 1"
    # Martes: 10:00, 12:00, 14:00, 17:00 y 19:00
    - cron: "0 8,9,10,11,12,13,15,16,17,18 * * 2"
  workflow_dispatch:

# Evita que dos actualizaciones de cartelera se ejecuten a la vez.
concurrency:
  group: actualizar-cartelera-larraun
  cancel-in-progress: false

# Necesario para que GITHUB_TOKEN pueda guardar el JSON actualizado.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Comprobar horario local (Europe/Madrid)
        id: horario
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Las ejecuciones manuales siempre se ejecutan, sin comprobar horario.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Ejecución manual: se continúa."
            exit 0
          fi

          DIA_HORA="$(TZ=Europe/Madrid date +'%u-%H')"
          case "$DIA_HORA" in
            1-10|1-12|1-14|1-17|1-19|1-21|1-23|\
            2-10|2-12|2-14|2-17|2-19)
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "Horario programado correcto: $DIA_HORA (Europe/Madrid)"
              ;;
            *)
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Ejecución omitida: $DIA_HORA no corresponde al horario configurado."
              ;;
          esac

      - name: Checkout
        if: steps.horario.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        if: steps.horario.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Instala jsdom sin guardarlo en package.json ni en package-lock.json.
      - name: Instalar jsdom
        if: steps.horario.outputs.run == 'true'
        run: npm install jsdom --no-save

      - name: Ejecutar scraper
        if: steps.horario.outputs.run == 'true'
        run: node scripts/scrape-cartelera.mjs

      - name: Guardar cambios en GitHub
        if: steps.horario.outputs.run == 'true'
        run: |
          git config user.name "larraun-bot"
          git config user.email "bot@larraunpilota.eus"

          git add data/cartelera-larraun.json

          if git diff --cached --quiet; then
            echo "Sin cambios en la cartelera. No se crea ningún commit."
          else
            git commit -m "🔄 Actualiza cartelera Larraun"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            git push origin "$GITHUB_REF_NAME"
          fi
