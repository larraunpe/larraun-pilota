<!DOCTYPE html>
<html lang="eu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Etxeko partiduak – Larraun Pilota Elkartea</title>

<meta property="og:title" content="Etxeko partiduak – Larraun Pilota Elkartea">
<meta property="og:description" content="Aste honetako partiduak Larraunen">
<meta property="og:image" content="https://larraunpilota.eus/og-etxeko-partiduak.jpg">
<meta property="og:url" content="https://larraunpilota.eus/etxeko-partiduak.html">
<meta property="og:type" content="website">

<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">


<style>

/* =========================================================
   GENERAL
   ========================================================= */

body{
  font-family:Arial, Helvetica, sans-serif;
  background:#f4f4f4;
  margin:0;
  padding:20px;
}

header{
  text-align:center;
  margin-bottom:25px;
}

header img{
  height:80px;
  max-width:100%;
}

h1{
  margin:10px 0 0;
  color:#004d40;
}

#content{
  max-width:900px;
  margin:auto;
}


/* =========================================================
   DÍA
   ========================================================= */

.day-separator{
  margin:36px 0 18px;
  text-align:center;
  font-weight:900;
  font-size:1.1em;
  color:#333;
}


/* =========================================================
   GRUPO / FESTIVAL
   ========================================================= */

.group{
  margin-bottom:22px;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 4px 10px rgba(0,0,0,.2);
}

.group.no-oficial{
  background:#f0f0f0;
}


/* =========================================================
   CABECERA
   ========================================================= */

.group-header{
  padding:14px 18px;
  color:#fff;
}

.jai-alai .group-header{
  background:#1565c0;
}

.trinkete .group-header{
  background:#ad1457;
}


/* COLORES DE LOS FRONTONES */

.lekunberri .group-header{
  box-shadow:inset 0 0 0 4px #1b5e20;
}

.aldatz .group-header{
  box-shadow:inset 0 0 0 4px #4e342e;
}

.mugiro .group-header{
  box-shadow:inset 0 0 0 4px #bf360c;
}

.gorriti .group-header{
  box-shadow:inset 0 0 0 4px #bf360c;
}

.astitz .group-header{
  box-shadow:inset 0 0 0 4px #6a1b9a;
}


.fronton{
  font-size:1.25em;
  font-weight:900;
}

.datetime{
  font-size:1em;
  margin-top:4px;
}


/* =========================================================
   CUERPO
   ========================================================= */

.group-body{
  background:#fff;
  padding:16px 18px;
}


/* =========================================================
   PARTIDO
   ========================================================= */

.match{
  padding-top:12px;
  margin-top:12px;
  border-top:1px solid #ddd;
}

.match:first-child{
  margin-top:0;
  padding-top:0;
  border-top:none;
}


/* =========================================================
   CABECERA DEL PARTIDO
   ========================================================= */

.match-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.torneo{
  font-size:1.1em;
  font-weight:900;
  margin-bottom:6px;
}


/* =========================================================
   PELOTARIS
   ========================================================= */

.etxekoa{
  color:#0d47a1;
  font-weight:700;
}

.kanpokoa{
  color:#b71c1c;
  font-weight:700;
}


/* =========================================================
   PARTIDO SUSPENDIDO
   ========================================================= */

.match.suspendido{

  background:#eeeeee;

  border-radius:10px;

  padding:12px 14px;

  margin-left:-4px;
  margin-right:-4px;

  border-top:1px solid #d0d0d0;
}

.match.suspendido .torneo{
  color:#555;
}

.match.suspendido .etxekoa,
.match.suspendido .kanpokoa{
  opacity:.75;
}


/* TEXTO SUSPENDITUTA */

.match-susp{

  color:#c62828;

  font-weight:900;

  font-size:.95em;

  text-align:right;

  white-space:nowrap;
}


/* =========================================================
   MENSAJE DE ERROR
   ========================================================= */

.error-message{

  background:#fff;

  padding:20px;

  border-radius:12px;

  text-align:center;

  color:#b71c1c;

  font-weight:bold;

  box-shadow:0 3px 8px rgba(0,0,0,.15);
}


/* =========================================================
   MÓVIL
   ========================================================= */

@media(max-width:600px){

  body{
    padding:12px;
  }

  header img{
    height:65px;
  }

  h1{
    font-size:1.5em;
  }

  .group-header{
    padding:12px 14px;
  }

  .fronton{
    font-size:1.1em;
  }

  .datetime{
    font-size:.9em;
  }

  .group-body{
    padding:12px 14px;
  }

  .match.suspendido{
    padding:11px 12px;
  }

  .match-top{
    align-items:flex-start;
  }

  .match-susp{
    font-size:.85em;
  }

}

</style>
</head>


<body>


<header>

  <img
    src="images/etxekoak.jpg"
    alt="Larraun Pilota"
  >

  <h1>Etxeko partiduak</h1>

</header>


<div id="content"></div>


<script>

/* =========================================================
   FECHA DEL LUNES
   ========================================================= */

function monday(d){

  const x=new Date(d);

  const day=x.getDay() || 7;

  if(day!==1){
    x.setDate(x.getDate()-day+1);
  }

  x.setHours(0,0,0,0);

  return x;
}


/* =========================================================
   FECHA EN EUSKERA
   ========================================================= */

function dayEU(d){

  const days=[
    "IGANDEA",
    "ASTELEHENA",
    "ASTEARTEA",
    "ASTEAZKENA",
    "OSTEGUNA",
    "OSTIRALA",
    "LARUNBATA"
  ];

  const months=[
    "URTARRILA",
    "OTSAILA",
    "MARTXOA",
    "APIRILA",
    "MAIATZA",
    "EKAINA",
    "UZTAILA",
    "ABUZTUA",
    "IRAILA",
    "URRIA",
    "AZAROA",
    "ABENDUA"
  ];

  return `${days[d.getDay()]} · ${d.getDate()} ${months[d.getMonth()]}`;
}


/* =========================================================
   ORDEN DE ZKIA
   =========================================================

   Valores:

   1       → 1
   2       → 2
   3       → 3
   10      → 10
   SUSP    → posición especial

   Los números se ordenan numéricamente.

   SUSP se coloca después de los partidos numerados,
   salvo que existan varios SUSP, que mantienen su orden
   original.
   ========================================================= */

function ordenZkia(valor){

  if(
    valor===undefined ||
    valor===null
  ){
    return Number.MAX_SAFE_INTEGER;
  }

  const texto=
    String(valor)
      .trim()
      .toUpperCase();

  if(texto==="SUSP"){
    return Number.MAX_SAFE_INTEGER;
  }

  const numero=parseInt(texto,10);

  if(!isNaN(numero)){
    return numero;
  }

  return Number.MAX_SAFE_INTEGER;
}


/* =========================================================
   CARGAR LOS DOS JSON
   ========================================================= */

Promise.all([

  fetch("data/cartelera-larraun.json")
    .then(r=>{

      if(!r.ok){
        throw new Error(
          "No se ha podido cargar cartelera-larraun.json"
        );
      }

      return r.json();
    }),

  fetch("data/partidos-no-oficiales.json")
    .then(r=>{

      if(!r.ok){
        throw new Error(
          "No se ha podido cargar partidos-no-oficiales.json"
        );
      }

      return r.json();
    })

])


.then(([oficiales,noOficiales])=>{


  /* =======================================================
     UNIR LOS DOS ORÍGENES
     ======================================================= */

  const partidos=[

    ...oficiales.map(p=>({

      ...p,

      ofiziala:true

    })),

    ...noOficiales.map(p=>({

      ...p,

      /*
       * Si el JSON de no oficiales no trae ofiziala,
       * se considera no oficial.
       */
      ofiziala:false

    }))

  ];


  /* =======================================================
     SEMANA ACTUAL
     ======================================================= */

  const today=new Date();

  today.setHours(0,0,0,0);

  const mon=monday(today);

  const sun=new Date(mon);

  sun.setDate(
    mon.getDate()+6
  );

  sun.setHours(
    23,
    59,
    59,
    999
  );


  /* =======================================================
     FRONTONES DEL CLUB
     ======================================================= */

  const data=partidos.filter(p=>{


    /*
     * Solo estos cinco frontones.
     */

    if(
      !/lekunberri|aldatz|gorriti|mugiro|astitz/i
        .test(p.fronton || "")
    ){

      return false;

    }


    const d=new Date(

      `${p.fecha} ${p.hora || "00:00"}`

    );


    return d>=mon && d<=sun;

  });


  /* =======================================================
     AGRUPAR FESTIVALES
     =======================================================

     ESTA ES LA PARTE IMPORTANTE.

     Cada festival se identifica mediante:

       FRONTÓN
       +
       FECHA
       +
       HORA

     De esta manera un festival SOLO SE CREA UNA VEZ.

     Todos sus partidos quedan dentro del mismo bloque.
     ======================================================= */

  const festivales=new Map();


  data.forEach(p=>{


    const key=[

      String(p.fronton || "").trim(),

      String(p.fecha || "").trim(),

      String(p.hora || "").trim()

    ].join("|");


    if(!festivales.has(key)){

      festivales.set(
        key,
        []
      );

    }


    festivales
      .get(key)
      .push(p);

  });


  /* =======================================================
     CONVERTIR MAP EN ARRAY
     ======================================================= */

  const listaFestivales=
    Array.from(
      festivales.values()
    );


  /* =======================================================
     ORDENAR FESTIVALES
     ======================================================= */

  listaFestivales.sort((a,b)=>{


    const pa=a[0];

    const pb=b[0];


    const da=new Date(

      `${pa.fecha} ${pa.hora || "00:00"}`

    );


    const db=new Date(

      `${pb.fecha} ${pb.hora || "00:00"}`

    );


    /*
     * Primero fecha y hora.
     */

    if(da-db!==0){

      return da-db;

    }


    /*
     * En caso de misma fecha/hora,
     * orden alfabético por frontón.
     */

    return (

      pa.fronton || ""

    ).localeCompare(

      pb.fronton || ""

    );

  });


  /* =======================================================
     CONTENEDOR
     ======================================================= */

  const cont=
    document.getElementById(
      "content"
    );


  let lastDay="";


  /* =======================================================
     CREAR CADA FESTIVAL UNA SOLA VEZ
     ======================================================= */

  listaFestivales.forEach(bloque=>{


    /*
     * Primer partido del festival.
     * Sirve para obtener los datos comunes.
     */

    const b0=bloque[0];


    /* =====================================================
       FECHA
       ===================================================== */

    const d=new Date(

      `${b0.fecha} ${b0.hora || "00:00"}`

    );


    const dayKey=
      d.toDateString();


    /* =====================================================
       SEPARADOR DE DÍA
       ===================================================== */

    if(dayKey!==lastDay){

      cont.innerHTML+=`

        <div class="day-separator">

          — ${dayEU(d)} —

        </div>

      `;

      lastDay=dayKey;

    }


    /* =====================================================
       ORDENAR PARTIDOS SEGÚN ZKIA
       ===================================================== */

    bloque.sort((a,b)=>{


      const za=
        ordenZkia(a.zkia);

      const zb=
        ordenZkia(b.zkia);


      if(za!==zb){

        return za-zb;

      }


      /*
       * Si ambos tienen el mismo valor especial
       * (por ejemplo dos SUSP), conservamos el orden
       * en el que llegaron del JSON.
       */

      return 0;

    });


    /* =====================================================
       CLASE DEL FRONTÓN
       ===================================================== */

    let additionalClass="";


    if(
      /gorriti/i.test(
        b0.fronton || ""
      )
    ){

      additionalClass=" gorriti";

    }

    else if(
      /astitz/i.test(
        b0.fronton || ""
      )
    ){

      additionalClass=" astitz";

    }

    else if(
      /mugiro/i.test(
        b0.fronton || ""
      )
    ){

      additionalClass=" mugiro";

    }

    else if(
      /lekunberri/i.test(
        b0.fronton || ""
      )
    ){

      additionalClass=" lekunberri";

    }

    else if(
      /aldatz/i.test(
        b0.fronton || ""
      )
    ){

      additionalClass=" aldatz";

    }


    /* =====================================================
       CREAR GRUPO
       ===================================================== */

    const group=
      document.createElement(
        "div"
      );


    group.className=

      "group" +

      (
        !b0.ofiziala
          ? " no-oficial"
          : ""
      ) +

      (
        /trinkete/i.test(
          b0.fronton || ""
        )
          ? " trinkete"
          : " jai-alai"
      ) +

      additionalClass;


    /* =====================================================
       CABECERA
       ===================================================== */

    group.innerHTML=`

      <div class="group-header">

        <div class="fronton">

          📍 ${b0.fronton || ""}

        </div>

        <div class="datetime">

          🗓 ${b0.fecha || ""}

          ·

          ⏰ ${b0.hora || ""}

        </div>

      </div>

      <div class="group-body"></div>

    `;


    const body=
      group.querySelector(
        ".group-body"
      );


    /* =====================================================
       CREAR TODOS LOS PARTIDOS
       ===================================================== */

    bloque.forEach(m=>{


      /* ===================================================
         COMPROBAR SI ESTÁ SUSPENDIDO
         =================================================== */

      const suspendido=

        String(
          m.zkia || ""
        )
        .trim()
        .toUpperCase()==="SUSP";


      /* ===================================================
         NÚMERO
         =================================================== */

      let numero;


      if(suspendido){

        numero="-";

      }

      else if(
        m.zkia!==undefined &&
        m.zkia!==null &&
        String(m.zkia).trim()!==""
      ){

        numero=
          String(m.zkia).trim();

      }

      else{

        numero="";

      }


      /* ===================================================
         CREAR ELEMENTO
         =================================================== */

      const match=
        document.createElement(
          "div"
        );


      match.className=

        "match" +

        (
          suspendido
            ? " suspendido"
            : ""
        );


      /* ===================================================
         CONTENIDO
         =================================================== */

      match.innerHTML=`

        <div class="match-top">

          <div class="torneo">

            ${numero}

            ${
              m.lehiaketa
                ? ` · ${m.lehiaketa}`
                : ""
            }

          </div>

          ${
            suspendido
              ? `
                <div class="match-susp">

                  SUSPENDITUTA

                </div>
              `
              : ""
          }

        </div>


        <div class="etxekoa">

          🏠 ${m.etxekoa || ""}

        </div>


        <div class="kanpokoa">

          ✈️ ${m.kanpokoak || ""}

        </div>

      `;


      body.appendChild(
        match
      );

    });


    /* =====================================================
       AÑADIR FESTIVAL A LA PÁGINA
       ===================================================== */

    cont.appendChild(
      group
    );

  });


  /* =======================================================
     SI NO HAY PARTIDOS
     ======================================================= */

  if(listaFestivales.length===0){

    cont.innerHTML=`

      <div class="error-message">

        Ez dago etxeko partidurik aste honetan.

      </div>

    `;

  }

})


/* =========================================================
   ERROR DE CARGA
   ========================================================= */

.catch(error=>{

  console.error(
    "Errorea datuak kargatzean:",
    error
  );


  document.getElementById(
    "content"
  ).innerHTML=`

    <div class="error-message">

      Ezin izan dira partiduak kargatu.

    </div>

  `;

});

</script>

</body>
</html>
```
