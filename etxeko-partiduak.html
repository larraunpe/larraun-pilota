<body>

<header>
  <img src="images/etxekoak.jpg" alt="Larraun Pilota">
  <h1>Etxeko partiduak</h1>
</header>

<div id="content"></div>


<script>

/* =========================================================
   FECHAS
   ========================================================= */

function monday(d){
  const x=new Date(d);
  const day=x.getDay()||7;

  if(day!==1){
    x.setDate(x.getDate()-day+1);
  }

  x.setHours(0,0,0,0);

  return x;
}


function dayEU(d){

  const days=[
    "IGANDEA",
    "ASTELEHENA",
    "ASTEARTEA",
    "ASTEAZKENA",
    "OSTEGUNA",
    "OSTIRALA",
    "LARUNBATA"
  ];

  const months=[
    "URTARRILA",
    "OTSAILA",
    "MARTXOA",
    "APIRILA",
    "MAIATZA",
    "EKAINA",
    "UZTAILA",
    "ABUZTUA",
    "IRAILA",
    "URRIA",
    "AZAROA",
    "ABENDUA"
  ];

  return `${days[d.getDay()]} · ${d.getDate()} ${months[d.getMonth()]}`;
}


/* =========================================================
   ORDEN DE LOS PARTIDOS
   =========================================================
   Se utiliza SIEMPRE el campo "zkia".

   Ejemplo:
   zkia = 1  → 1
   zkia = 2  → 2
   zkia = 10 → 10
   zkia = SUSP → -

   Los partidos numerados se ordenan numéricamente.
   Los SUSP se mantienen después de los partidos numerados.
   ========================================================= */

function ordenZkia(valor){

  if(valor===undefined || valor===null){
    return Number.MAX_SAFE_INTEGER;
  }

  const texto=String(valor).trim().toUpperCase();

  if(texto==="SUSP"){
    return Number.MAX_SAFE_INTEGER;
  }

  const numero=parseInt(texto,10);

  if(!isNaN(numero)){
    return numero;
  }

  return Number.MAX_SAFE_INTEGER;
}


/* =========================================================
   CARGA DE DATOS
   ========================================================= */

Promise.all([

  fetch("data/cartelera-larraun.json")
    .then(r=>r.json()),

  fetch("data/partidos-no-oficiales.json")
    .then(r=>r.json())

]).then(([oficiales,noOficiales])=>{


  /* =======================================================
     UNIR LOS DOS ORÍGENES
     ======================================================= */

  const partidos=[

    ...oficiales.map(p=>({
      ...p,
      ofiziala:true
    })),

    ...noOficiales

  ];


  /* =======================================================
     SEMANA ACTUAL
     ======================================================= */

  const today=new Date();

  today.setHours(0,0,0,0);

  const mon=monday(today);

  const sun=new Date(mon);

  sun.setDate(mon.getDate()+6);

  sun.setHours(23,59,59,999);


  /* =======================================================
     SOLO FRONTONES DE LARRAUN
     ======================================================= */

  const data=partidos.filter(p=>{

    if(
      !/lekunberri|aldatz|gorriti|mugiro|astitz/i
        .test(p.fronton||"")
    ){
      return false;
    }

    const d=new Date(
      `${p.fecha} ${p.hora||"00:00"}`
    );

    return d>=mon && d<=sun;

  });


  /* =======================================================
     ORDEN GENERAL:
     1. FECHA
     2. HORA
     3. FRONTÓN
     4. ZKIA
     ======================================================= */

  data.sort((a,b)=>{

    const da=new Date(
      `${a.fecha} ${a.hora||"00:00"}`
    );

    const db=new Date(
      `${b.fecha} ${b.hora||"00:00"}`
    );

    const diferenciaFecha=da-db;

    if(diferenciaFecha!==0){
      return diferenciaFecha;
    }


    const frontonA=(a.fronton||"").toLowerCase();
    const frontonB=(b.fronton||"").toLowerCase();

    const diferenciaFronton=
      frontonA.localeCompare(frontonB);

    if(diferenciaFronton!==0){
      return diferenciaFronton;
    }


    /* ===== ORDEN SEGÚN ZKIA ===== */

    const za=ordenZkia(a.zkia);
    const zb=ordenZkia(b.zkia);

    if(za!==zb){
      return za-zb;
    }

    return 0;

  });


  /* =======================================================
     CONTENEDOR
     ======================================================= */

  const cont=document.getElementById("content");

  let lastDay="";


  /* =======================================================
     RECORRER PARTIDOS
     ======================================================= */

  data.forEach(p=>{


    /* =====================================================
       FECHA DEL PARTIDO
       ===================================================== */

    const d=new Date(
      `${p.fecha} ${p.hora||"00:00"}`
    );

    const dayKey=d.toDateString();


    /* =====================================================
       SEPARADOR DE DÍA
       ===================================================== */

    if(dayKey!==lastDay){

      cont.innerHTML+=`
        <div class="day-separator">
          — ${dayEU(d)} —
        </div>
      `;

      lastDay=dayKey;
    }


    /* =====================================================
       CLAVE DEL GRUPO
       ===================================================== */

    const key=
      `${p.fronton}|${p.fecha}|${p.hora}`;


    if(document.getElementById(
      CSS.escape(key)
    )){
      return;
    }


    /* =====================================================
       TODOS LOS PARTIDOS DEL MISMO FRONTÓN / HORA
       ===================================================== */

    const bloque=data.filter(x=>
      `${x.fronton}|${x.fecha}|${x.hora}`===key
    );


    /* =====================================================
       ORDENAR LOS PARTIDOS DEL BLOQUE POR ZKIA
       ===================================================== */

    bloque.sort((a,b)=>{

      const za=ordenZkia(a.zkia);
      const zb=ordenZkia(b.zkia);

      if(za!==zb){
        return za-zb;
      }

      return 0;

    });


    const b0=bloque[0];


    /* =====================================================
       CREAR GRUPO
       ===================================================== */

    const group=document.createElement("div");

    group.id=key;


    /* =====================================================
       CLASES DEL FRONTÓN
       ===================================================== */

    let additionalClass="";

    if(/gorriti/i.test(b0.fronton)){
      additionalClass=" gorriti";
    }

    else if(/astitz/i.test(b0.fronton)){
      additionalClass=" astitz";
    }

    else if(/mugiro/i.test(b0.fronton)){
      additionalClass=" mugiro";
    }

    else if(/lekunberri/i.test(b0.fronton)){
      additionalClass=" lekunberri";
    }

    else if(/aldatz/i.test(b0.fronton)){
      additionalClass=" aldatz";
    }


    /* =====================================================
       CLASE FINAL DEL GRUPO
       ===================================================== */

    group.className=
      "group"+
      (!b0.ofiziala ? " no-oficial" : "")+
      (/trinkete/i.test(b0.fronton)
        ? " trinkete"
        : " jai-alai")+
      additionalClass;


    /* =====================================================
       CABECERA
       ===================================================== */

    group.innerHTML=`

      <div class="group-header">

        <div class="fronton">
          📍 ${b0.fronton||""}
        </div>

        <div class="datetime">
          🗓 ${b0.fecha||""}
          ·
          ⏰ ${b0.hora||""}
        </div>

      </div>

      <div class="group-body"></div>

    `;


    const body=
      group.querySelector(".group-body");


    /* =====================================================
       PARTIDOS DEL BLOQUE
       ===================================================== */

    bloque.forEach((m)=>{


      /* ===================================================
         DETECTAR SUSPENDIDO
         =================================================== */

      const suspendido=
        String(m.zkia||"")
          .trim()
          .toUpperCase()==="SUSP";


      /* ===================================================
         NÚMERO DEL PARTIDO
         =================================================== */

      const numero=
        suspendido
          ? "-"
          : (
              m.zkia!==undefined &&
              m.zkia!==null &&
              String(m.zkia).trim()!==""
                ? String(m.zkia)
                : ""
            );


      /* ===================================================
         CREAR PARTIDO
         =================================================== */

      const match=
        document.createElement("div");


      match.className=
        "match"+
        (suspendido ? " suspendido" : "");


      /* ===================================================
         PARTE SUPERIOR
         =================================================== */

      match.innerHTML=`

        <div class="match-top">

          <div class="torneo">
            ${numero} · ${m.lehiaketa||""}
          </div>

          ${
            suspendido
              ? `
                <div class="match-susp">
                  SUSPENDITUTA
                </div>
              `
              : ""
          }

        </div>

        <div class="etxekoa">
          🏠 ${m.etxekoa||""}
        </div>

        <div class="kanpokoa">
          ✈️ ${m.kanpokoak||""}
        </div>

      `;


      body.appendChild(match);

    });


    /* =====================================================
       AÑADIR GRUPO A LA PÁGINA
       ===================================================== */

    cont.appendChild(group);

  });

}).catch(error=>{

  console.error(
    "Errorea datuak kargatzean:",
    error
  );

  document.getElementById("content").innerHTML=`

    <div style="
      background:#fff;
      padding:20px;
      border-radius:12px;
      text-align:center;
      color:#b71c1c;
      font-weight:bold;
    ">
      Ezin izan dira partiduak kargatu.
    </div>

  `;

});

</script>

</body>
</html>
